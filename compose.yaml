# Project database. Credentials come from .env next to this file (POSTGRES_USER,
# POSTGRES_PASSWORD, POSTGRES_DB); only those are passed to the container.
# Start: docker compose up -d --build     Stop: docker compose stop
name: std  # the folder name is non-ASCII, so Compose cannot derive a project name from it
services:
  db:
    build: ./db
    image: std-postgis-vector-mobility:17
    container_name: std_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # MobilityDB needs PostGIS preloaded and more lock slots than the default.
    command: ["postgres", "-c", "shared_preload_libraries=postgis-3", "-c", "max_locks_per_transaction=128"]
    ports:
      - "127.0.0.1:5432:5432"  # this machine only
    volumes:
      - std_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

volumes:
  std_pgdata:
